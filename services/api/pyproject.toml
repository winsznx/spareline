[project]
name = "spareline-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "ortools>=9.11",
  "numpy>=2.1",
  "ijson>=3.3",
  "orjson>=3.10",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "hypothesis>=6.115", "ruff>=0.7"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E731"]
